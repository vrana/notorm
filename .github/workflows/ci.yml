name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.0', '8.5' ] # the oldest supported and the latest

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, pdo_pgsql
          ini-values: pdo_mysql.default_socket=/var/run/mysqld/mysqld.sock # tests/connect.inc.php connects to localhost
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer check
      - name: Create the test databases # the tests create the tables from tests/software.sql
        run: |
          read -r user password < <(sed -n 's/.*new PDO("\$driver:\$dsn", "\([^"]*\)", "\([^"]*\)").*/\1 \2/p' tests/connect.inc.php)
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE software; CREATE USER '$user'@'localhost' IDENTIFIED BY '$password'; GRANT ALL ON software.* TO '$user'@'localhost'"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE ROLE \"$user\" LOGIN PASSWORD '$password'" -c "CREATE DATABASE software OWNER \"$user\""
      - run: composer test
